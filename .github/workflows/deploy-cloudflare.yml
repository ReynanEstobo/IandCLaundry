name: Deploy I&C Laundry

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Do not run two production deployments at the same time. A newer push waits
# for the active deployment instead of racing it.
concurrency:
  group: ic-laundry-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy production Worker
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # A failing test stops the job here, so a broken commit never reaches
      # production.
      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
